services:
  api:
    image: integracar/redeneuralbert:8.0
    container_name: integracar-api
    networks:
      - internal
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: /api/classificar
    container_name: integracar-frontend
    depends_on:
      - api
    ports:
      - "5173:80"
    networks:
      - internal
      - proxy
    restart: unless-stopped

networks:
  internal:
    driver: bridge
  proxy:
    external: true
